# publish-npm.yml — publish `service-tunnels` to the npm official registry.
#
# Single-package variant of the aiti-ai/aiti-ai publish-npm.yml decision
# matrix: this repo ships one package, so the content-hash skip / auto-bump
# machinery is unnecessary — the version is bumped manually on release.
#
# Trigger: workflow_dispatch (manual)
#   dry_run: true (default) — preflight + typecheck + tests + build + pack
#   verification (dist/src/docs present, no test/node_modules leakage into the
#   tarball); false — publish for real.
#
# Auth (either path works):
#   NPM_TOKEN secret — granular automation token with read/write on the
#     service-tunnels package (publisher nightwend).
#   npmjs Trusted Publishing (OIDC, token-free) — bind the package on
#     npmjs.com to aiti-ai/service-tunnels + this workflow file; then
#     --provenance works without any token. Preferred once bound.

name: NPM Publish

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (preflight + tests + build + pack verification, no publish)"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  id-token: write # npm provenance (official publishes carry --provenance)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org" # writes ~/.npmrc for publish auth
          cache: npm

      - name: Preflight — registry identity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm whoami

      # npm install (not ci): the lockfile pins @aiti-ai/ddns from the private
      # staging registry where integrity may differ from the official tarball;
      # install re-resolves and self-heals. Official publishes are gated by
      # tests below either way.
      - name: Install deps
        run: npm install --include=dev --no-audit --no-fund --loglevel=error

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (all green or no publish)
        run: npm test

      # dist/ is gitignored — the tarball can only ship what CI builds here.
      # build = justget browser bundle + vendor copy + tsc + dts fixups.
      - name: Build
        run: npm run build

      - name: Pack — verify tarball contents (dist + src + docs present, no test/node_modules leakage)
        # npm 10 (node22 CI) prefixes files[].path with 'package/' and keeps
        # lifecycle stdout on stderr; npm 11 drops the prefix and prints it to
        # stdout — normalize both here so the check works on either.
        run: |
          npm pack --dry-run --json > pack.json 2>/dev/null
          node -e "
            const raw = require('fs').readFileSync('pack.json','utf8');
            function extractJson(s) {
              try { return JSON.parse(s); } catch {}
              const lines = s.split('\n');
              for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim() === '[') { try { return JSON.parse(lines.slice(i).join('\n')); } catch {} }
              }
              throw new Error('no JSON array found in npm pack output');
            }
            const pkg = JSON.parse(require('fs').readFileSync('package.json','utf8'));
            const bundled = (pkg.bundleDependencies || []).map(d => 'node_modules/' + d + '/');
            const files = extractJson(raw)[0].files.map(f => f.path.replace(/^package\//, ''));
            const mustHave = ['dist/index.js', 'dist/index.d.ts', 'dist/cli.js', 'src/index.ts', 'README.md', 'LICENSE', 'CHANGELOG.md',
              ...bundled.map(p => p + 'package.json')];
            const missing = mustHave.filter(f => !files.includes(f));
            if (missing.length) { console.error('missing from tarball: ' + missing.join(', ')); process.exit(1); }
            const leaked = files.filter(f =>
              f.startsWith('test/') || (f.startsWith('node_modules/') && !bundled.some(p => f.startsWith(p))));
            if (leaked.length) { console.error('internal paths leaked into the tarball: ' + leaked.join(', ')); process.exit(1); }
            console.log('tarball ok: ' + files.length + ' files (bundled deps whitelisted: ' + bundled.length + ')');
          "
          rm -f pack.json

      - name: Publish
        if: ${{ inputs.dry_run == 'false' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --registry https://registry.npmjs.org

      # ---- Scoped alias: @aiti-ai/service-tunnels ----
      # Placeholder shell depending on "service-tunnels": "*" (always-latest);
      # re-exports the API + shims the CLI bins. Rides the same version line
      # as the main package. NOTE: published to npmjs ONLY — the private
      # registry (npm.alot.pw) uses this exact name for the pi-web extension,
      # a different artifact; alias/package.json pins publishConfig to npmjs.
      - name: Sync alias version
        run: node scripts/sync-alias-version.mjs

      - name: Pack alias — verify tarball (files + version parity + "*" dep contract)
        # Same npm 10/11 normalization as the main pack check above.
        working-directory: alias
        run: |
          npm pack --dry-run --json > /tmp/alias-pack.json 2>/dev/null
          node -e "
            const raw = require('fs').readFileSync('/tmp/alias-pack.json','utf8');
            function extractJson(s) {
              try { return JSON.parse(s); } catch {}
              const lines = s.split('\n');
              for (let i = 0; i < lines.length; i++) {
                if (lines[i].trim() === '[') { try { return JSON.parse(lines.slice(i).join('\n')); } catch {} }
              }
              throw new Error('no JSON array found in npm pack output');
            }
            const pack = extractJson(raw)[0];
            const files = pack.files.map(f => f.path.replace(/^package\//, ''));
            const mustHave = ['index.js', 'index.d.ts', 'bin.js', 'README.md', 'package.json'];
            const missing = mustHave.filter(f => !files.includes(f));
            if (missing.length) { console.error('missing from alias tarball: ' + missing.join(', ')); process.exit(1); }
            const leaked = files.filter(f => f.startsWith('node_modules/') || f.startsWith('test/'));
            if (leaked.length) { console.error('internal paths leaked into the alias tarball: ' + leaked.join(', ')); process.exit(1); }
            const root = JSON.parse(require('fs').readFileSync('../package.json','utf8'));
            if (pack.version !== root.version) { console.error('alias version ' + pack.version + ' != root version ' + root.version); process.exit(1); }
            const deps = JSON.parse(require('fs').readFileSync('package.json','utf8')).dependencies;
            if (deps['service-tunnels'] !== '*') { console.error('alias dep on service-tunnels must be \"*\" (always-latest contract), got: ' + deps['service-tunnels']); process.exit(1); }
            console.log('alias tarball ok: ' + pack.name + '@' + pack.version + ', ' + files.length + ' files');
          "

      - name: Publish alias (@aiti-ai/service-tunnels)
        if: ${{ inputs.dry_run == 'false' }}
        working-directory: alias
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public --registry https://registry.npmjs.org

      - name: Summary
        run: |
          echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_STEP_SUMMARY"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_STEP_SUMMARY"
          echo "alias=@aiti-ai/service-tunnels@$(node -p "require('./alias/package.json').version") (always-latest shell)" >> "$GITHUB_STEP_SUMMARY"
